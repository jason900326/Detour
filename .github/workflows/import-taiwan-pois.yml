name: Import Taiwan POIs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Normalize only; do not write Supabase"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "23 4 5 * *"
  push:
    branches:
      - fix-minute-readout-slow-modal
      - main
    paths:
      - ".github/workflows/import-taiwan-pois.yml"
      - "backend/detour-poi/pois-v1.sql"
      - "scripts/import_overture_pois.py"
      - "scripts/test_import_overture_pois.py"

permissions:
  contents: read

concurrency:
  group: import-taiwan-pois
  cancel-in-progress: false

jobs:
  import-pois:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: https://ldlhzyfubjbuumikrkuv.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify Supabase secret
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SECRET_KEY" || (echo "Missing repository secret SUPABASE_SECRET_KEY" && exit 1)

      - name: Install pinned Overture client
        run: python -m pip install overturemaps==1.0.2

      - name: Test POI normalization
        run: python -m unittest discover -s scripts -p 'test_import_overture_pois.py' -v

      - name: Download Taiwan Overture Places
        shell: bash
        run: |
          set -euo pipefail
          overturemaps download --bbox=119.9,21.8,122.1,25.5 -f geojsonseq --type=place -o /tmp/taiwan-main-pois.geojsonseq
          overturemaps download --bbox=119.2,23.1,119.8,23.9 -f geojsonseq --type=place -o /tmp/taiwan-penghu-pois.geojsonseq
          overturemaps download --bbox=118.1,24.3,118.6,24.6 -f geojsonseq --type=place -o /tmp/taiwan-kinmen-pois.geojsonseq
          overturemaps download --bbox=119.8,25.9,120.6,26.4 -f geojsonseq --type=place -o /tmp/taiwan-matsu-pois.geojsonseq
          wc -l /tmp/taiwan-*-pois.geojsonseq

      - name: Import normalized POIs into Supabase
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --input /tmp/taiwan-main-pois.geojsonseq
            --input /tmp/taiwan-penghu-pois.geojsonseq
            --input /tmp/taiwan-kinmen-pois.geojsonseq
            --input /tmp/taiwan-matsu-pois.geojsonseq
            --report-output /tmp/detour-poi-import-report.json
          )
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          python scripts/import_overture_pois.py "${args[@]}"

      - name: Upload POI import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detour-poi-import-report
          path: /tmp/detour-poi-import-report.json
          if-no-files-found: ignore
