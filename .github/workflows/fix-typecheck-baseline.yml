name: Fix TypeScript baseline

on:
  push:
    branches:
      - refactor/app-architecture-v1
    paths:
      - "scripts/fix-typecheck-baseline.py"
      - ".github/workflows/fix-typecheck-baseline.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    name: Fix typecheck and verify app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v5
        with:
          ref: refactor/app-architecture-v1
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply TypeScript cleanup
        run: python scripts/fix-typecheck-baseline.py

      - name: Validate diff
        run: git diff --check

      - name: Typecheck app
        run: npm run typecheck

      - name: Bundle iOS app
        run: npx expo export --platform ios --output-dir /tmp/detour-typecheck-export

      - name: Commit validated cleanup
        shell: bash
        run: |
          git config user.name "detour-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/index.tsx src/app/camera.tsx src/types/styles.d.ts tsconfig.json
          git rm scripts/fix-typecheck-baseline.py .github/workflows/fix-typecheck-baseline.yml
          git commit -m "fix: establish clean TypeScript app baseline"
          git push origin HEAD:refactor/app-architecture-v1
