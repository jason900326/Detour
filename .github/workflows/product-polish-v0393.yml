name: Apply DETOUR v0.39.3 field-test polish

on:
  push:
    branches: [main]
    paths:
      - 'scripts/product_polish_v0393.py'
      - '.github/workflows/product-polish-v0393.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply field-test polish
        run: python3 scripts/product_polish_v0393.py

      - name: Syntax-check changed TypeScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');
          for (const file of ['src/app/index.tsx', 'src/app/camera.tsx', 'src/lib/journey-engine.ts', 'src/lib/build-info.ts']) {
            const source = fs.readFileSync(file, 'utf8');
            const result = ts.transpileModule(source, {
              compilerOptions: {
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.ESNext,
                jsx: ts.JsxEmit.ReactJSX,
              },
              fileName: file,
              reportDiagnostics: true,
            });
            const errors = (result.diagnostics || []).filter(d => d.category === ts.DiagnosticCategory.Error);
            if (errors.length) {
              console.error(file);
              for (const d of errors) console.error(ts.flattenDiagnosticMessageText(d.messageText, '\n'));
              process.exit(1);
            }
          }
          NODE

      - name: Verify product invariants
        run: |
          grep -F "DETOUR_BUILD_VERSION = '0.39.3'" src/lib/build-info.ts
          grep -F "尋找題目要是「看東西」，不是「讀題目」" PRODUCT_FOUNDATION.md
          grep -F "missionRevealedIndex === sideMissionIndex" src/app/index.tsx
          grep -F "開始找" src/app/index.tsx
          grep -F "backgroundColor: selectedColor.hex" src/app/index.tsx
          grep -F "promptDot" src/app/camera.tsx
          if grep -Fq "找一個不是你造成的移動" src/lib/journey-engine.ts; then exit 1; fi
          if grep -Fq "ticketReadySubtitle}>" src/app/index.tsx; then exit 1; fi
          git diff --check

      - name: Remove one-time migration files
        run: |
          rm -f scripts/product_polish_v0393.py
          rm -f .github/workflows/product-polish-v0393.yml

      - name: Commit field-test polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "feat: polish DETOUR v0.39.3 field flow"
          git push origin HEAD:main
