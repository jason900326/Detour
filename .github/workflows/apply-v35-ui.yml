name: Apply DETOUR v0.35 UI migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-v35-ui.yml"
      - "scripts/apply-v35-ui.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply v0.35 migration
        run: python scripts/apply-v35-ui.py

      - name: Install dependencies and refresh lockfile
        run: npm install --no-audit --no-fund

      - name: Parse-check migrated TypeScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');
          const files = [
            'src/app/index.tsx',
            'src/app/camera.tsx',
            'src/lib/journey-engine.ts',
            'src/lib/playtest-analytics.ts',
          ];
          let failed = false;
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            const result = ts.transpileModule(source, {
              fileName: file,
              reportDiagnostics: true,
              compilerOptions: {
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.ESNext,
                jsx: ts.JsxEmit.ReactJSX,
              },
            });
            const errors = (result.diagnostics || []).filter(
              (d) => d.category === ts.DiagnosticCategory.Error
            );
            if (errors.length) {
              failed = true;
              console.error(`Parse errors in ${file}:`);
              for (const d of errors) {
                console.error(ts.flattenDiagnosticMessageText(d.messageText, '\n'));
              }
            }
          }
          if (failed) process.exit(1);
          console.log('Migrated TypeScript parsed successfully.');
          NODE

      - name: Remove one-time migration files
        run: |
          rm -f scripts/apply-v35-ui.py
          rm -f .github/workflows/apply-v35-ui.yml

      - name: Commit generated UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "feat: apply DETOUR v0.35 visual redesign"
          git push origin HEAD:main
