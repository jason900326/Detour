name: Fate dice and ticket feed

on:
  push:
    branches:
      - fix/fate-dice-ticket-feed
    paths:
      - ".github/workflows/fate-dice-ticket-feed.yml"
      - "scripts/fix_fate_and_ticket_feed.py"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply fate and ticket patch
        run: python scripts/fix_fate_and_ticket_feed.py

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle iOS app
        run: npx expo export --platform ios --output-dir /tmp/detour-fate-ticket

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/detour-home-view.tsx src/components/ticket-visuals.tsx src/styles/home/ticket-recap-styles.ts
          git commit -m "fix: turn fate into dice and lead with barcode"
          git push origin HEAD:fix/fate-dice-ticket-feed
