name: V2 branch quality

on:
  push:
    branches:
      - codex/detour-v2-outdoor-hardening
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/v2-quality.yml"

concurrency:
  group: v2-quality-branch
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository quality checks
        run: npm run quality
