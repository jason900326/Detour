name: Apply DETOUR v0.44 mood and ticket redesign

on:
  push:
    branches:
      - chatgpt/v044-mood-ticket
    paths:
      - 'scripts/v044_mood_ticket.py'
      - '.github/workflows/v044-mood-ticket.yml'

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply v0.44 migration
        run: python3 scripts/v044_mood_ticket.py

      - name: Syntax-check changed TypeScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');
          for (const file of ['src/app/index.tsx', 'src/lib/build-info.ts']) {
            const source = fs.readFileSync(file, 'utf8');
            const result = ts.transpileModule(source, {
              compilerOptions: {
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.ESNext,
                jsx: ts.JsxEmit.ReactJSX,
              },
              fileName: file,
              reportDiagnostics: true,
            });
            const errors = (result.diagnostics || []).filter(d => d.category === ts.DiagnosticCategory.Error);
            if (errors.length) {
              console.error(file);
              for (const d of errors) console.error(ts.flattenDiagnosticMessageText(d.messageText, '\n'));
              process.exit(1);
            }
          }
          NODE

      - name: Verify v0.44 invariants
        run: |
          grep -F "DETOUR_BUILD_VERSION = '0.44.0'" src/lib/build-info.ts
          grep -F "styles.v44MoodGlyph" src/app/index.tsx
          grep -F "styles.v44TicketPaper" src/app/index.tsx
          grep -F "outputRange: [18, 436]" src/app/index.tsx
          if grep -Fq '>探索票<' src/app/index.tsx; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          t = Path('src/app/index.tsx').read_text()
          mood_start = t.index('function MoodGlyph(')
          mood_end = t.index('function moodHint', mood_start)
          mood = t[mood_start:mood_end]
          assert 'active ?' not in mood
          assert 'v44QuietSlash' in mood
          assert 'v44WeirdOddTile' in mood
          assert 'v44ColorSwatch' in mood
          ticket_start = t.index('function DetourTicket(')
          ticket_end = t.index('export default function HomeScreen()', ticket_start)
          ticket = t[ticket_start:ticket_end]
          assert 'v44TicketPaper' in ticket
          assert 'v44TicketFooterMark' not in ticket
          assert '探索票' not in ticket
          assert t.count('<DetourTicket') == 2
          PY
          git diff --check

      - name: Remove one-time migration files
        run: |
          rm -f scripts/v044_mood_ticket.py
          rm -f .github/workflows/v044-mood-ticket.yml

      - name: Commit convergence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: redesign DETOUR moods and ticket"
          git push origin HEAD:chatgpt/v044-mood-ticket
