name: Apply ticket-base 75 percent UI geometry

on:
  push:
    branches:
      - fix/ticket-base-75-percent-ui
    paths:
      - .github/workflows/apply-ticket-75-ui.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/ticket-base-75-percent-ui
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply ticket UI geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/detour-home-view.tsx')
          text = path.read_text()

          old_import = "  PanResponder,\n  Pressable,"
          new_import = "  PanResponder,\n  PixelRatio,\n  Pressable,"
          if old_import not in text:
              raise SystemExit('React Native import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_geometry = (
              "    // The native slot is the source of truth for paper width. The paper keeps\n"
              "    // visible mechanical clearance on both sides instead of chasing px values.\n"
              "    const slotWidth = Math.max(1, printerWidth - 6);\n"
              "    // Restore the previously-good paper-to-slot proportion. This is a\n"
              "    // design ratio, not a guessed device px width. The slot remains the\n"
              "    // source of truth and the paper is always derived from it.\n"
              "    const ticketSlotFillRatio = 0.72;\n"
              "    const ticketWidthFromSlot = slotWidth * ticketSlotFillRatio;\n\n"
              "    // The width rule normally wins. Short screens can only shrink the same\n"
              "    // authored ticket proportionally; they never distort or crop it.\n"
              "    const chromeAndPrinterTop = 48 + 48 + 67 + 12 + 47;\n"
              "    const tearHintReserve = 52 + bottomPadding;\n"
              "    const maxPaperHeight = Math.max(1, windowHeight - topPadding - chromeAndPrinterTop - tearHintReserve);\n"
              "    const ticketAspect = DETOUR_TICKET_HEIGHT / DETOUR_TICKET_WIDTH;\n"
              "    const ticketWidthFromHeight = maxPaperHeight / ticketAspect;\n"
              "    const ticketWidth = Math.max(1, Math.min(ticketWidthFromSlot, ticketWidthFromHeight));\n"
          )
          new_geometry = (
              "    // The slot is only a physical ceiling. The intended ticket size comes\n"
              "    // from ticket-base itself: 1122px rendered at the requested ~75%, then\n"
              "    // converted from physical image pixels to React Native layout units.\n"
              "    // No paper-to-slot tuning ratio is used.\n"
              "    const slotWidth = Math.max(1, printerWidth - 6);\n"
              "    const ticketArtworkWidthPx = 1122;\n"
              "    const ticketArtworkRenderScale = 0.75;\n"
              "    const ticketWidthFromArtwork =\n"
              "      (ticketArtworkWidthPx * ticketArtworkRenderScale) / PixelRatio.get();\n\n"
              "    // The artwork target normally wins. The slot and available vertical\n"
              "    // space may only shrink the same aspect ratio; they never enlarge it.\n"
              "    const chromeAndPrinterTop = 48 + 48 + 67 + 12 + 47;\n"
              "    const tearHintReserve = 52 + bottomPadding;\n"
              "    const maxPaperHeight = Math.max(1, windowHeight - topPadding - chromeAndPrinterTop - tearHintReserve);\n"
              "    const ticketAspect = DETOUR_TICKET_HEIGHT / DETOUR_TICKET_WIDTH;\n"
              "    const ticketWidthFromHeight = maxPaperHeight / ticketAspect;\n"
              "    const ticketWidth = Math.max(\n"
              "      1,\n"
              "      Math.min(ticketWidthFromArtwork, slotWidth, ticketWidthFromHeight)\n"
              "    );\n"
          )
          if old_geometry not in text:
              raise SystemExit('printing geometry anchor not found')
          text = text.replace(old_geometry, new_geometry, 1)

          old_track = (
              "                    {\n"
              "                      width: printingLayout.slotWidth,\n"
              "                      transform: [\n"
          )
          new_track = (
              "                    {\n"
              "                      width: printingLayout.slotWidth,\n"
              "                      alignItems: 'center',\n"
              "                      transform: [\n"
          )
          if old_track not in text:
              raise SystemExit('paper track anchor not found')
          text = text.replace(old_track, new_track, 1)

          path.write_text(text)
          PY

          git diff --check
          git diff -- src/components/detour-home-view.tsx

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle iOS
        run: npx expo export --platform ios --output-dir /tmp/detour-ticket-75-export

      - name: Commit verified UI change
        run: |
          rm .github/workflows/apply-ticket-75-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/detour-home-view.tsx .github/workflows/apply-ticket-75-ui.yml
          git commit -m "fix: size ticket-base from artwork scale"
          git push origin HEAD:fix/ticket-base-75-percent-ui
