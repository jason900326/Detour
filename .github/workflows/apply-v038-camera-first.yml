name: Apply DETOUR v0.38 camera-first fixes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-v038-camera-first.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Expo-compatible view capture
        run: npx expo install react-native-view-shot

      - name: Apply v0.38 field fixes
        run: python .github/scripts/apply-v038-camera-first.py

      - name: Syntax-check changed TypeScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');
          const files = [
            'src/app/index.tsx',
            'src/app/camera.tsx',
            'src/lib/journey-engine.ts',
            'src/lib/scene-engine.ts',
            'src/lib/ai-engine.ts',
            'backend/detour-ai/index.ts',
            'src/lib/playtest-analytics.ts',
            'src/lib/build-info.ts',
          ];
          let failed = false;
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            const out = ts.transpileModule(source, {
              fileName: file,
              reportDiagnostics: true,
              compilerOptions: {
                jsx: ts.JsxEmit.ReactJSX,
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.ESNext,
              },
            });
            const errors = (out.diagnostics || []).filter(
              (d) => d.category === ts.DiagnosticCategory.Error
            );
            if (errors.length) {
              failed = true;
              console.error(`\n${file}`);
              for (const error of errors) {
                console.error(ts.flattenDiagnosticMessageText(error.messageText, '\n'));
              }
            }
          }
          if (failed) process.exit(1);
          console.log('Changed TypeScript files parse successfully.');
          NODE

      - name: Verify key v0.38 rules
        run: |
          grep -q "這次想怎麼晃" src/app/index.tsx
          grep -q "拍一個紅色" src/lib/journey-engine.ts
          grep -q "NON_CAMERA_ARRIVAL_PHRASES" src/lib/ai-engine.ts
          grep -q "MAX_DIGITAL_ZOOM" src/app/camera.tsx
          grep -q "react-native-view-shot" package.json
          grep -q "分享車票" src/app/index.tsx

      - name: Remove migration files
        run: |
          rm .github/workflows/apply-v038-camera-first.yml
          rm .github/scripts/apply-v038-camera-first.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make DETOUR camera-first and shareable"
          git push origin main
