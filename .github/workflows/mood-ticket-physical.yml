name: Apply Mood + ticket UI

on:
  push:
    branches:
      - chatgpt/mood-ticket-physical
    paths:
      - .github/workflows/mood-ticket-physical.yml
      - .github/scripts/apply-mood-ticket-physical.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/mood-ticket-physical
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply UI migration
        run: |
          python .github/scripts/apply-mood-ticket-physical.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/index.tsx')
          s = p.read_text(encoding='utf-8')
          old = "position: 'absolute', top: 0, width: '100%', height: 108, borderRadius: 20,"
          new = "position: 'absolute', top: 0, width: '100%', height: 92, borderRadius: 20,"
          if s.count(old) != 1:
              raise SystemExit(f'printer height patch expected 1 match, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify product invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/app/index.tsx').read_text(encoding='utf-8')
          required = [
              "label: '隨便走'", "label: '吃東西'", "label: '想安靜'",
              "label: '這是哪'", "label: '色色的'", "label: '命運'",
              'styles.v46PrinterMachine', 'styles.v46PaperReveal',
              "outputRange: [0, 432]",
              '<Text style={styles.v46TicketLabel}>旅程時間</Text>',
              '<Text style={styles.v46TicketLabel}>此趟心情</Text>',
              '<Text style={styles.v46TicketLabel}>目的地</Text>',
              "moodId={selectedMood ?? 'wander'}",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Missing invariants: ' + repr(missing))
          mood_block = text[text.index('const MOODS:'):text.index('const FREE_CAMERA_MISSION')]
          for old in ['隨便走走', '吃點東西', '放鬆一下', '探索新鮮', '拍照走走', '交給驚喜']:
              if old in mood_block:
                  raise SystemExit('Old Mood label remains: ' + old)
          preparing = text[text.index("{stage === 'preparing'"):text.index("{stage === 'ready'")]
          if '<V45Skyline />' in preparing:
              raise SystemExit('Preparing skyline should be removed')
          if 'translateY: routeProgress.interpolate' in preparing:
              raise SystemExit('Old floating-paper animation remains')
          if "height: 92" not in text[text.index('v46PrinterMachine:'):text.index('v46PrinterMetalHighlight:')]:
              raise SystemExit('Metal printer height patch missing')
          print('Product invariants OK')
          PY

      - name: Syntax-check TypeScript
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');
          const source = fs.readFileSync('src/app/index.tsx', 'utf8');
          const out = ts.transpileModule(source, {
            compilerOptions: {
              jsx: ts.JsxEmit.ReactJSX,
              target: ts.ScriptTarget.ES2022,
              module: ts.ModuleKind.ESNext,
            },
            reportDiagnostics: true,
            fileName: 'src/app/index.tsx',
          });
          const errors = (out.diagnostics || []).filter(d => d.category === ts.DiagnosticCategory.Error);
          if (errors.length) {
            console.error(errors.map(d => ts.flattenDiagnosticMessageText(d.messageText, '\n')).join('\n'));
            process.exit(1);
          }
          console.log('TypeScript syntax OK');
          NODE

      - name: Bundle-check Expo
        run: npx expo export --platform ios --output-dir .tmp-v0452-export --clear

      - name: Clean one-time files
        run: |
          rm -rf .tmp-v0452-export
          rm .github/scripts/apply-mood-ticket-physical.py
          rm .github/workflows/mood-ticket-physical.yml

      - name: Check diff
        run: git diff --check

      - name: Commit finished UI only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: lock approved Mood and physical ticket printer"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:chatgpt/mood-ticket-physical; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
