name: Split Detour home controller

on:
  push:
    branches:
      - refactor/split-main-screen
    paths:
      - scripts/split-home-controller.cjs
      - .github/workflows/split-home-controller.yml

permissions:
  contents: write

jobs:
  split:
    name: Split controller and view
    runs-on: ubuntu-latest

    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v5
        with:
          ref: refactor/split-main-screen
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Split controller and view
        run: node scripts/split-home-controller.cjs

      - name: Validate diff
        run: git diff --check

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle iOS app
        run: npx expo export --platform ios --output-dir /tmp/detour-controller-export

      - name: Commit validated split
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "detour-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/index.tsx src/hooks/use-detour-home-controller.ts src/components/detour-home-view.tsx
          git rm scripts/split-home-controller.cjs .github/workflows/split-home-controller.yml
          git commit -m "refactor: separate home controller from view"
          git push origin HEAD:refactor/split-main-screen
