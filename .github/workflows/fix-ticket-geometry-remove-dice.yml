name: Fix ticket geometry and remove dice

on:
  push:
    branches:
      - fix/remove-dice-restore-ticket-geometry
    paths:
      - ".github/workflows/fix-ticket-geometry-remove-dice.yml"
      - "scripts/fix_ticket_geometry_remove_dice.py"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply focused patch
        run: python scripts/fix_ticket_geometry_remove_dice.py

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle iOS app
        run: npx expo export --platform ios --output-dir /tmp/detour-ticket-geometry

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/detour-home-view.tsx src/styles/home/ticket-recap-styles.ts
          git commit -m "fix: remove dice and restore physical ticket feed"
          git push origin HEAD:fix/remove-dice-restore-ticket-geometry
