name: Resume Taiwan POI Import

on:
  push:
    branches:
      - fix-minute-readout-slow-modal
    paths:
      - ".github/workflows/resume-taiwan-pois.yml"

permissions:
  contents: read

concurrency:
  group: import-taiwan-pois
  cancel-in-progress: false

jobs:
  resume-pois:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: https://ldlhzyfubjbuumikrkuv.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify Supabase secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SECRET_KEY" || (echo "Missing repository secret SUPABASE_SECRET_KEY" && exit 1)

      - name: Install pinned Overture client
        run: python -m pip install overturemaps==1.0.2

      - name: Download remaining Taiwan Places
        shell: bash
        run: |
          set -euo pipefail
          overturemaps download --bbox=119.9,24.4,122.1,25.5 -f geojsonseq --type=place -o /tmp/taiwan-north-pois.geojsonseq
          overturemaps download --bbox=119.2,23.1,119.8,23.9 -f geojsonseq --type=place -o /tmp/taiwan-penghu-pois.geojsonseq
          overturemaps download --bbox=118.1,24.3,118.6,24.6 -f geojsonseq --type=place -o /tmp/taiwan-kinmen-pois.geojsonseq
          overturemaps download --bbox=119.8,25.9,120.6,26.4 -f geojsonseq --type=place -o /tmp/taiwan-matsu-pois.geojsonseq

      - name: Resume existing import batch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/import_overture_pois.py \
            --batch overture-20260917T074023Z-d7735948 \
            --input /tmp/taiwan-north-pois.geojsonseq \
            --input /tmp/taiwan-penghu-pois.geojsonseq \
            --input /tmp/taiwan-kinmen-pois.geojsonseq \
            --input /tmp/taiwan-matsu-pois.geojsonseq \
            --report-output /tmp/detour-poi-resume-report.json

      - name: Upload POI resume report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detour-poi-resume-report
          path: /tmp/detour-poi-resume-report.json
          if-no-files-found: ignore
