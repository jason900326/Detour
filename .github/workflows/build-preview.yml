name: Build DETOUR iOS preview

on:
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "ios/**"
      - "modules/**"
      - ".github/workflows/build-preview.yml"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "app.json"
      - "ios/**"
      - "modules/**"
      - ".github/workflows/build-preview.yml"
  workflow_dispatch:

concurrency:
  group: detour-ios-preview-build
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Check native changes
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - name: Checkout repository for push events
        if: github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v5

      - name: Detect native changes
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            native:
              - "package.json"
              - "package-lock.json"
              - "app.json"
              - "ios/**"
              - "modules/**"

  build:
    name: EAS iOS internal distribution
    needs: changes
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.native == 'true'
    permissions:
      contents: read

    steps:
      - name: Check Expo token
        id: expo_token
        shell: bash
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN is not configured yet; skipping iOS Preview build."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout repository
        if: steps.expo_token.outputs.skip != 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        if: steps.expo_token.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup EAS
        if: steps.expo_token.outputs.skip != 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.expo_token.outputs.skip != 'true'
        run: npm ci --no-audit --no-fund

      - name: Build iOS Preview
        if: steps.expo_token.outputs.skip != 'true'
        run: eas build --platform ios --profile preview --non-interactive
