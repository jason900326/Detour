name: Apply single-source ticket scale fix

on:
  push:
    branches:
      - fix/single-source-ticket-scale

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Restore one ticket scale source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/detour-home-view.tsx')
          text = path.read_text()

          replacements = [
              (
                  '    const ticketSlotFillRatio = 0.84;\n',
                  '    // Restore the previously-good paper-to-slot proportion. This is a\n'
                  '    // design ratio, not a guessed device px width. The slot remains the\n'
                  '    // source of truth and the paper is always derived from it.\n'
                  '    const ticketSlotFillRatio = 0.72;\n',
              ),
              (
                  '    const ticketWidth = Math.max(1, Math.min(ticketWidthFromSlot, ticketWidthFromHeight));\n'
                  '    const ticketScale = ticketWidth / DETOUR_TICKET_WIDTH;\n'
                  '    const ticketHeight = DETOUR_TICKET_HEIGHT * ticketScale;\n',
                  '    const ticketWidth = Math.max(1, Math.min(ticketWidthFromSlot, ticketWidthFromHeight));\n'
                  '    // ticketWidth is the single final rendered paper width. V45Ticket\n'
                  '    // derives its one visual scale from this value; the page does not\n'
                  '    // apply another ticket scale on top of it.\n'
                  '    const ticketHeight = ticketWidth * ticketAspect;\n',
              ),
              (
                  '      ticketWidth,\n      ticketHeight,\n      ticketScale,\n',
                  '      ticketWidth,\n      ticketHeight,\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle iOS
        run: npx expo export --platform ios --output-dir /tmp/detour-single-scale-export

      - name: Commit verified fix
        shell: bash
        run: |
          rm .github/workflows/apply-single-ticket-scale.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/detour-home-view.tsx .github/workflows/apply-single-ticket-scale.yml
          git commit -m "fix: use one source of truth for ticket scale"
          git push origin HEAD:${GITHUB_REF_NAME}
