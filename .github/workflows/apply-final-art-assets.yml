name: Apply final Detour artwork

on:
  push:
    branches:
      - chatgpt/final-art-assets
    paths:
      - .github/workflows/apply-final-art-assets.yml
      - .github/scripts/apply-final-art-assets.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: chatgpt/final-art-assets
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply artwork integration
        run: python .github/scripts/apply-final-art-assets.py

      - name: Verify artwork invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/app/index.tsx').read_text(encoding='utf-8')
          build = Path('src/lib/build-info.ts').read_text(encoding='utf-8')
          required = [
              "require('../../assets/detour/home-hero-route.png')",
              "require('../../assets/detour/printer-front.png')",
              "require('../../assets/detour/ticket-base.png')",
              "require('../../assets/detour/journey-review-template.png')",
              "require('../../assets/detour/journey-complete-template.png')",
              'function V46CompleteArtwork(',
              'function V46ReviewArtwork(',
              'styles.v46ArtPrinterStage',
              'styles.v46ArtTicket',
              '<V45MoodIcon moodId={item.id} />',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Missing artwork invariants: ' + repr(missing))
          if "DETOUR_BUILD_VERSION = '0.46.0'" not in build:
              raise SystemExit('Build version was not updated')
          if 'v45PrinterMachine' in text[text.index("{stage === 'preparing'"):text.index("{stage === 'ready'")]:
              raise SystemExit('Legacy CSS printer still used in preparing screen')
          if '<V45Skyline />' in text[text.index("{stage === 'finish'"):text.index("{stage === 'passport'")]:
              raise SystemExit('Legacy skyline still used on completion artwork')
          print('Artwork invariants OK')
          PY

      - name: Syntax-check TypeScript
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');
          const files = ['src/app/index.tsx', 'src/lib/build-info.ts'];
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            const out = ts.transpileModule(source, {
              compilerOptions: {
                jsx: ts.JsxEmit.ReactJSX,
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.ESNext,
              },
              reportDiagnostics: true,
              fileName: file,
            });
            const errors = (out.diagnostics || []).filter(d => d.category === ts.DiagnosticCategory.Error);
            if (errors.length) {
              console.error(file);
              console.error(errors.map(d => ts.flattenDiagnosticMessageText(d.messageText, '\n')).join('\n'));
              process.exit(1);
            }
          }
          console.log('TypeScript syntax OK');
          NODE

      - name: Bundle-check Expo
        run: npx expo export --platform ios --output-dir .tmp-art-export --clear

      - name: Clean one-time files
        run: |
          rm -rf .tmp-art-export
          rm .github/scripts/apply-final-art-assets.py
          rm .github/workflows/apply-final-art-assets.yml

      - name: Check diff
        run: git diff --check

      - name: Commit finished artwork integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire final Detour artwork into product UI"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:chatgpt/final-art-assets; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
