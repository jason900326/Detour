name: Apply DETOUR v0.39 product convergence

on:
  push:
    branches: [main]
    paths:
      - 'scripts/product_convergence_v039.py'
      - '.github/workflows/product-convergence-v039.yml'

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply product convergence
        run: python3 scripts/product_convergence_v039.py

      - name: Syntax-check changed TypeScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');
          for (const file of ['src/app/index.tsx', 'src/app/camera.tsx', 'src/lib/journey-engine.ts', 'src/lib/build-info.ts']) {
            const source = fs.readFileSync(file, 'utf8');
            const result = ts.transpileModule(source, {
              compilerOptions: {
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.ESNext,
                jsx: ts.JsxEmit.ReactJSX,
              },
              fileName: file,
              reportDiagnostics: true,
            });
            const errors = (result.diagnostics || []).filter(d => d.category === ts.DiagnosticCategory.Error);
            if (errors.length) {
              console.error(file);
              for (const d of errors) console.error(ts.flattenDiagnosticMessageText(d.messageText, '\n'));
              process.exit(1);
            }
          }
          NODE

      - name: Verify product invariants
        run: |
          grep -F "DETOUR_BUILD_VERSION = '0.39.2'" src/lib/build-info.ts
          grep -F "### v0.39 產品語言收斂：體驗要自己說明自己" PRODUCT_FOUNDATION.md
          grep -F "V0.39" /dev/null 2>/dev/null || true
          grep -F "sideMissionCount = 7" src/lib/journey-engine.ts
          grep -F "sideMissionCount = Math.min(10" src/lib/journey-engine.ts
          grep -F "看到就拍" src/app/index.tsx
          grep -F "onLongPress={toggleDevMode}" src/app/index.tsx
          grep -F "這趟照片" src/app/camera.tsx
          test -f V039_PRODUCT_CONVERGENCE.md
          if grep -Fq "FIELD EVENT" src/app/index.tsx; then exit 1; fi
          if grep -Fq "SIDE QUEST · {currentMission.code}" src/app/index.tsx; then exit 1; fi
          if grep -Fq "DETOUR CAMERA" src/app/camera.tsx; then exit 1; fi
          git diff --check

      - name: Remove one-time migration files
        run: |
          rm -f scripts/product_convergence_v039.py
          rm -f .github/workflows/product-convergence-v039.yml

      - name: Commit product convergence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "feat: converge DETOUR v0.39 product language"
          git push origin HEAD:main
