name: Detour code quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - prototype/freeform-ticket-tear
    paths:
      - "src/**"
      - "backend/**"
      - "scripts/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  validate:
    name: Typecheck and bundle iOS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply one-time ticket viewport fix
        if: github.event_name == 'push' && github.ref == 'refs/heads/prototype/freeform-ticket-tear' && github.event.head_commit.message == 'chore: apply exact ticket viewport fix'
        run: |
          git checkout afaedfebbd4deb92a4e23234c2019d6a22980799 -- src/components/detour-home-view.tsx
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/detour-home-view.tsx')
          text = path.read_text()
          old = '<View style={styles.v48PaperViewport} pointerEvents="none">'
          new = '<View style={styles.v48PaperViewport}>'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one viewport marker, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/detour-home-view.tsx
          git commit -m "fix: enable ticket tear hit testing"
          git push origin HEAD:prototype/freeform-ticket-tear

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Prototype branch added Skia before its lockfile is regenerated on the
      # developer machine. Use npm install here so CI can validate the graphics
      # experiment; restore npm ci before this work is merged to main.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Check Scene importer syntax
        run: python3 -m py_compile scripts/import_osm_scenes.py

      - name: Bundle iOS app
        run: npx expo export --platform ios --output-dir /tmp/detour-quality-export
