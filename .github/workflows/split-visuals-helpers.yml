name: Split Detour visual and helper domains

on:
  push:
    branches:
      - refactor/split-main-screen
    paths:
      - scripts/split-visuals-helpers.py
      - .github/workflows/split-visuals-helpers.yml

permissions:
  contents: write

jobs:
  split:
    name: Split visual and helper modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v5
        with:
          ref: refactor/split-main-screen
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Split visual and helper modules
        run: python scripts/split-visuals-helpers.py

      - name: Validate diff
        run: git diff --check

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle iOS app
        run: npx expo export --platform ios --output-dir /tmp/detour-domain-split-export

      - name: Commit validated split
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "detour-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components src/lib src/hooks/use-detour-home-controller.ts
          git rm scripts/split-visuals-helpers.py .github/workflows/split-visuals-helpers.yml
          git commit -m "refactor: split visual and helper domains"
          git push origin HEAD:refactor/split-main-screen
