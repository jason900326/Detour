name: Apply v0.46.1 print fixes

on:
  push:
    branches:
      - chatgpt/v0461-print-fix

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/v0461-print-fix
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply v0.46.1 migration
        run: python scripts/v0461_print_fix.py

      - name: Verify UI invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('src/app/index.tsx').read_text()
          required = [
              "function DetourAccentStroke(",
              "outputRange: [8, 392]",
              "v47PrintTicketBottomAnchor",
              "top: -25",
              "bottom: 24",
              "DETOUR_BUILD_VERSION = '0.46.1'",
          ]
          build = Path('src/lib/build-info.ts').read_text()
          for item in required[:-1]:
              assert item in s, item
          assert required[-1] in build
          assert s.count('<DetourAccentStroke ') == 5
          print('UI invariants OK')
          PY

      - name: Syntax-check TypeScript
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');
          for (const file of ['src/app/index.tsx','src/lib/build-info.ts']) {
            const src = fs.readFileSync(file, 'utf8');
            const out = ts.transpileModule(src, {
              compilerOptions: {
                jsx: ts.JsxEmit.ReactJSX,
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.ESNext,
              },
              fileName: file,
              reportDiagnostics: true,
            });
            const errors = (out.diagnostics || []).filter(d => d.category === ts.DiagnosticCategory.Error);
            if (errors.length) {
              console.error(file, errors.map(e => ts.flattenDiagnosticMessageText(e.messageText, '\n')).join('\n'));
              process.exit(1);
            }
          }
          console.log('TypeScript syntax OK');
          NODE

      - name: Bundle-check Expo iOS
        run: npx expo export --platform ios --output-dir /tmp/detour-v0461-bundle

      - name: Clean one-time files
        run: |
          rm -f scripts/v0461_print_fix.py
          rm -f .github/workflows/v0461-print-fix.yml

      - name: Check diff
        run: git diff --check

      - name: Commit finished fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/index.tsx src/lib/build-info.ts scripts .github/workflows
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "fix: correct ticket printing and accent strokes"
          git push origin HEAD:chatgpt/v0461-print-fix
