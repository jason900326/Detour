name: Apply ticket-base 75 percent UI geometry

on:
  push:
    branches:
      - fix/ticket-base-75-percent-ui
    paths:
      - .github/workflows/apply-ticket-75-ui.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/ticket-base-75-percent-ui
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply ticket UI geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/detour-home-view.tsx')
          text = path.read_text()

          old_import = "  PanResponder,\n  Pressable,"
          new_import = "  PanResponder,\n  PixelRatio,\n  Pressable,"
          if old_import not in text:
              raise SystemExit('React Native import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_geometry = """    // The native slot is the source of truth for paper width. The paper keeps
    // visible mechanical clearance on both sides instead of chasing px values.
    const slotWidth = Math.max(1, printerWidth - 6);
    // Restore the previously-good paper-to-slot proportion. This is a
    // design ratio, not a guessed device px width. The slot remains the
    // source of truth and the paper is always derived from it.
    const ticketSlotFillRatio = 0.72;
    const ticketWidthFromSlot = slotWidth * ticketSlotFillRatio;

    // The width rule normally wins. Short screens can only shrink the same
    // authored ticket proportionally; they never distort or crop it.
    const chromeAndPrinterTop = 48 + 48 + 67 + 12 + 47;
    const tearHintReserve = 52 + bottomPadding;
    const maxPaperHeight = Math.max(1, windowHeight - topPadding - chromeAndPrinterTop - tearHintReserve);
    const ticketAspect = DETOUR_TICKET_HEIGHT / DETOUR_TICKET_WIDTH;
    const ticketWidthFromHeight = maxPaperHeight / ticketAspect;
    const ticketWidth = Math.max(1, Math.min(ticketWidthFromSlot, ticketWidthFromHeight));
"""
          new_geometry = """    // The printer slot only acts as a hard physical ceiling. The intended
    // ticket size comes from the actual ticket-base artwork: render the 1122px
    // source at roughly 75% of its native pixel width, then convert physical
    // image pixels to React Native layout units using the device pixel ratio.
    // This replaces hand-tuned paper-to-slot ratios such as 0.72 / 0.84.
    const slotWidth = Math.max(1, printerWidth - 6);
    const ticketArtworkWidthPx = 1122;
    const ticketArtworkRenderScale = 0.75;
    const ticketWidthFromArtwork =
      (ticketArtworkWidthPx * ticketArtworkRenderScale) / PixelRatio.get();

    // The artwork target normally wins. The slot and available vertical space
    // can only shrink it proportionally; neither path can enlarge or distort it.
    const chromeAndPrinterTop = 48 + 48 + 67 + 12 + 47;
    const tearHintReserve = 52 + bottomPadding;
    const maxPaperHeight = Math.max(1, windowHeight - topPadding - chromeAndPrinterTop - tearHintReserve);
    const ticketAspect = DETOUR_TICKET_HEIGHT / DETOUR_TICKET_WIDTH;
    const ticketWidthFromHeight = maxPaperHeight / ticketAspect;
    const ticketWidth = Math.max(
      1,
      Math.min(ticketWidthFromArtwork, slotWidth, ticketWidthFromHeight)
    );
"""
          if old_geometry not in text:
              raise SystemExit('printing geometry anchor not found')
          text = text.replace(old_geometry, new_geometry, 1)

          old_track = """                    {
                      width: printingLayout.slotWidth,
                      transform: [
"""
          new_track = """                    {
                      width: printingLayout.slotWidth,
                      alignItems: 'center',
                      transform: [
"""
          if old_track not in text:
              raise SystemExit('paper track anchor not found')
          text = text.replace(old_track, new_track, 1)

          path.write_text(text)
          PY

          git diff --check
          git diff -- src/components/detour-home-view.tsx

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle iOS
        run: npx expo export --platform ios --output-dir /tmp/detour-ticket-75-export

      - name: Commit verified UI change
        run: |
          rm .github/workflows/apply-ticket-75-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/detour-home-view.tsx .github/workflows/apply-ticket-75-ui.yml
          git commit -m "fix: size ticket-base from artwork scale"
          git push origin HEAD:fix/ticket-base-75-percent-ui
