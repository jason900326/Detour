name: Apply DETOUR v0.43 UI convergence

on:
  push:
    branches:
      - chatgpt/v043-ui-convergence
    paths:
      - 'scripts/v043_ui_convergence.py'
      - '.github/workflows/v043-ui-convergence.yml'

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply v0.43 migration
        run: python3 scripts/v043_ui_convergence.py

      - name: Syntax-check changed TypeScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');
          for (const file of ['src/app/index.tsx', 'src/lib/build-info.ts']) {
            const source = fs.readFileSync(file, 'utf8');
            const result = ts.transpileModule(source, {
              compilerOptions: {
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.ESNext,
                jsx: ts.JsxEmit.ReactJSX,
              },
              fileName: file,
              reportDiagnostics: true,
            });
            const errors = (result.diagnostics || []).filter(d => d.category === ts.DiagnosticCategory.Error);
            if (errors.length) {
              console.error(file);
              for (const d of errors) console.error(ts.flattenDiagnosticMessageText(d.messageText, '\n'));
              process.exit(1);
            }
          }
          NODE

      - name: Verify v0.43 invariants
        run: |
          grep -F "DETOUR_BUILD_VERSION = '0.43.0'" src/lib/build-info.ts
          grep -F "function MoodGlyph(" src/app/index.tsx
          grep -F "<MoodGlyph moodId={item.id} active={active} />" src/app/index.tsx
          grep -F "developerToolsUnlocked" src/app/index.tsx
          grep -F "onLongPress={toggleDeveloperTools}" src/app/index.tsx
          grep -F "隱藏開發者工具" src/app/index.tsx
          grep -F "v43MemoryCard" src/app/index.tsx
          grep -F "v43MissionPhoto" src/app/index.tsx
          grep -F "v42TicketFlowScreen" src/app/index.tsx
          if grep -Fq "function moodSymbol(" src/app/index.tsx; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          t = Path('src/app/index.tsx').read_text()
          start = t.index("{stage === 'passportDetail' && selectedPassportEntry && (")
          end = t.index("</Animated.View>", start)
          detail = t[start:end]
          assert 'postcardMapShell' not in detail
          assert '<MapView' not in detail
          assert 'v43MemoryCard' in detail
          settings_start = t.index("{stage === 'settings' && (")
          settings_end = t.index("{stage === 'time' && (", settings_start)
          settings = t[settings_start:settings_end]
          assert 'developerToolsUnlocked' in settings
          assert 'onLongPress={toggleDeveloperTools}' in settings
          PY
          git diff --check

      - name: Remove one-time migration files
        run: |
          rm -f scripts/v043_ui_convergence.py
          rm -f .github/workflows/v043-ui-convergence.yml

      - name: Commit convergence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: converge DETOUR v0.43 consumer UI"
          git push origin HEAD:chatgpt/v043-ui-convergence
