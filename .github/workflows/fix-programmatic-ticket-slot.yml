name: Fix programmatic ticket slot

on:
  push:
    branches:
      - fix/programmatic-ticket-slot
    paths:
      - ".github/workflows/fix-programmatic-ticket-slot.yml"
      - "scripts/fix_programmatic_ticket_slot.py"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply slot patch
        run: python scripts/fix_programmatic_ticket_slot.py

      - name: Confirm deleted artwork is not referenced
        run: '! grep -R "printer-front.png" src'

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle iOS app
        run: npx expo export --platform ios --output-dir /tmp/detour-programmatic-slot

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/detour-home-view.tsx src/styles/home/ticket-recap-styles.ts
          git commit -m "fix: render ticket slot without artwork"
          git push origin HEAD:fix/programmatic-ticket-slot
