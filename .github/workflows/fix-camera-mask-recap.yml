name: Fix camera mask and recap thumbnails

on:
  push:
    branches:
      - fix/camera-mask-recap-thumbnails

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/camera-mask-recap-thumbnails
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Patch camera mask and recap strip
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          camera = Path('src/components/detour-camera-screen.tsx')
          s = camera.read_text(encoding='utf-8')
          old_markup = "      <View pointerEvents=\"none\" style={styles.squareGuideWrap}>\n        <View style={styles.squareGuide} />\n      </View>\n"
          new_markup = "      <View pointerEvents=\"none\" style={styles.squareMaskWrap}>\n        <View style={styles.squareMaskBand} />\n        <View style={styles.squareViewport}>\n          <View style={styles.squareGuide} />\n        </View>\n        <View style={styles.squareMaskBand} />\n      </View>\n"
          if old_markup not in s:
              raise SystemExit('camera square guide markup not found')
          s = s.replace(old_markup, new_markup, 1)

          old_styles = "  squareGuideWrap: { ...ABSOLUTE_FILL, alignItems: 'center', justifyContent: 'center', zIndex: 3 },\n  squareGuide: { width: '100%', aspectRatio: 1, borderWidth: StyleSheet.hairlineWidth, borderColor: 'rgba(255,255,255,0.46)' },\n"
          new_styles = "  squareMaskWrap: { ...ABSOLUTE_FILL, zIndex: 3 },\n  squareMaskBand: { flex: 1, width: '100%', backgroundColor: '#000' },\n  squareViewport: { width: '100%', aspectRatio: 1, position: 'relative' },\n  squareGuide: { ...ABSOLUTE_FILL, borderWidth: StyleSheet.hairlineWidth, borderColor: 'rgba(255,255,255,0.46)' },\n"
          if old_styles not in s:
              raise SystemExit('camera square guide styles not found')
          s = s.replace(old_styles, new_styles, 1)
          camera.write_text(s, encoding='utf-8')

          recap = Path('src/components/journey-recap-visuals.tsx')
          s = recap.read_text(encoding='utf-8')
          old_strip = "        {photos.slice(0, 6).map((photo, index) => (\n          <PlacedPhoto key={photo.id} delay={90 + index * 70}>\n            <Pressable\n              onPress={() => onPhotoIndex(index)}\n              style={styles.v54FilmPress}\n            >\n              <Image\n                source={{ uri: photo.uri }}\n                style={[\n                  styles.v54FilmPhoto,\n                  index === activeIndex && styles.v54FilmPhotoActive,\n                ]}\n                resizeMode=\"cover\"\n              />\n            </Pressable>\n          </PlacedPhoto>\n        ))}\n"
          new_strip = "        {photos.slice(0, 6).map((photo, index) => (\n          <Pressable\n            key={photo.id}\n            onPress={() => onPhotoIndex(index)}\n            style={styles.v54FilmPress}\n          >\n            <Image\n              source={{ uri: photo.uri }}\n              style={[\n                styles.v54FilmPhoto,\n                index === activeIndex && styles.v54FilmPhotoActive,\n              ]}\n              resizeMode=\"cover\"\n            />\n          </Pressable>\n        ))}\n"
          if old_strip not in s:
              raise SystemExit('recap photo strip block not found')
          s = s.replace(old_strip, new_strip, 1)
          recap.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle iOS
        run: npx expo export --platform ios --output-dir /tmp/detour-mask-recap-ios

      - name: Validate diff
        run: git diff --check

      - name: Commit verified fix
        shell: bash
        run: |
          git rm .github/workflows/fix-camera-mask-recap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/detour-camera-screen.tsx src/components/journey-recap-visuals.tsx
          git commit -m "fix: mask square camera and restore recap thumbnails"
          git push origin HEAD:fix/camera-mask-recap-thumbnails
