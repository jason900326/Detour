name: Fix Expo Go square camera v2

on:
  push:
    branches:
      - fix/camera-square-expo-go

permissions:
  contents: write

jobs:
  fix-and-verify:
    name: Patch and validate square camera
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/camera-square-expo-go
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install SDK-compatible image manipulator
        run: npx expo install expo-image-manipulator

      - name: Patch camera
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/detour-camera-screen.tsx')
          s = path.read_text(encoding='utf-8')

          s = s.replace(
              "  type CameraType,\n  type FlashMode,\n} from 'expo-camera';",
              "  type CameraCapturedPicture,\n  type CameraType,\n  type FlashMode,\n} from 'expo-camera';",
          )
          s = s.replace(
              "import { Directory, File, Paths } from 'expo-file-system';",
              "import { Directory, File, Paths } from 'expo-file-system';\nimport * as ImageManipulator from 'expo-image-manipulator';",
          )

          anchor = "function delay(ms: number) {\n  return new Promise((resolve) => setTimeout(resolve, ms));\n}\n"
          helper = (
              "function delay(ms: number) {\n"
              "  return new Promise((resolve) => setTimeout(resolve, ms));\n"
              "}\n\n"
              "async function cropCaptureToSquare(capture: CameraCapturedPicture) {\n"
              "  const side = Math.min(capture.width, capture.height);\n"
              "  const originX = Math.max(0, Math.round((capture.width - side) / 2));\n"
              "  const originY = Math.max(0, Math.round((capture.height - side) / 2));\n"
              "  return ImageManipulator.manipulateAsync(\n"
              "    capture.uri,\n"
              "    [{ crop: { originX, originY, width: side, height: side } }],\n"
              "    { compress: 0.84, format: ImageManipulator.SaveFormat.JPEG }\n"
              "  );\n"
              "}\n"
          )
          if anchor not in s:
              raise SystemExit('delay anchor not found')
          s = s.replace(anchor, helper, 1)

          old_capture = (
              "      const capture = await cameraRef.current.takePictureAsync({ quality: 0.84 });\n"
              "      if (!capture?.uri) throw new Error('No photo URI');\n\n"
              "      setPendingCaptureUri(capture.uri);\n"
              "      setTakingPhoto(false);\n"
          )
          new_capture = (
              "      // Capture once at source quality, then create the canonical 1:1 file.\n"
              "      // Review, session storage and Photos all use this exact square result.\n"
              "      const capture = await cameraRef.current.takePictureAsync({ quality: 1 });\n"
              "      if (!capture?.uri) throw new Error('No photo URI');\n\n"
              "      const squareCapture = await cropCaptureToSquare(capture);\n"
              "      setPendingCaptureUri(squareCapture.uri);\n"
              "      setTakingPhoto(false);\n"
          )
          if old_capture not in s:
              raise SystemExit('capture block not found')
          s = s.replace(old_capture, new_capture, 1)

          if '        autofocus="on"' not in s:
              raise SystemExit('autofocus prop not found')
          s = s.replace('        autofocus="on"', '        autofocus="off"', 1)

          camera_view_end = (
              "        onMountError={(event) => { setCameraReady(false); setMountError(event.message); }}\n"
              "      />\n\n"
              "      <Animated.View pointerEvents=\"none\" style={[styles.shutterFlash, { opacity: shutterFlash }]} />\n"
          )
          camera_view_replacement = (
              "        onMountError={(event) => { setCameraReady(false); setMountError(event.message); }}\n"
              "      />\n\n"
              "      <View pointerEvents=\"none\" style={styles.squareGuideWrap}>\n"
              "        <View style={styles.squareGuide} />\n"
              "      </View>\n\n"
              "      <Animated.View pointerEvents=\"none\" style={[styles.shutterFlash, { opacity: shutterFlash }]} />\n"
          )
          if camera_view_end not in s:
              raise SystemExit('camera view end anchor not found')
          s = s.replace(camera_view_end, camera_view_replacement, 1)

          style_anchor = (
              "  cameraScreen: { flex: 1, backgroundColor: '#000' },\n"
              "  cameraView: { flex: 1 },\n"
              "  shutterFlash: { ...ABSOLUTE_FILL, backgroundColor: '#000', zIndex: 4 },\n"
          )
          style_replacement = (
              "  cameraScreen: { flex: 1, backgroundColor: '#000' },\n"
              "  cameraView: { flex: 1 },\n"
              "  squareGuideWrap: { ...ABSOLUTE_FILL, alignItems: 'center', justifyContent: 'center', zIndex: 3 },\n"
              "  squareGuide: { width: '100%', aspectRatio: 1, borderWidth: StyleSheet.hairlineWidth, borderColor: 'rgba(255,255,255,0.46)' },\n"
              "  shutterFlash: { ...ABSOLUTE_FILL, backgroundColor: '#000', zIndex: 4 },\n"
          )
          if style_anchor not in s:
              raise SystemExit('camera style anchor not found')
          s = s.replace(style_anchor, style_replacement, 1)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Verify manipulator
        run: npm ls expo-image-manipulator --depth=0

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle iOS
        run: npx expo export --platform ios --output-dir /tmp/detour-camera-ios

      - name: Commit verified camera change
        shell: bash
        run: |
          git rm .github/workflows/fix-camera-square-expo-go.yml
          git rm .github/workflows/fix-camera-square-expo-go-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/components/detour-camera-screen.tsx
          git commit -m "fix: make Expo Go camera capture square"
          git push origin HEAD:fix/camera-square-expo-go
