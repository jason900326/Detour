name: Ticket speed feedback

on:
  push:
    branches:
      - fix/ticket-speed-feedback
    paths:
      - ".github/workflows/ticket-speed-feedback.yml"
      - "scripts/speed_up_ticket_issue.py"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply ticket speed patch
        run: python scripts/speed_up_ticket_issue.py

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle iOS app
        run: npx expo export --platform ios --output-dir /tmp/detour-ticket-speed

      - name: Commit verified ticket speed fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/use-detour-home-controller.ts src/components/detour-home-view.tsx src/lib/routing-engine.ts
          git commit -m "fix: make ticket issue feel immediate"
          git push origin HEAD:fix/ticket-speed-feedback
