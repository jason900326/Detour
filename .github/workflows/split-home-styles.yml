name: Split Detour home styles

on:
  push:
    branches:
      - refactor/split-main-screen
    paths:
      - scripts/split-home-styles.cjs
      - .github/workflows/split-home-styles.yml

permissions:
  contents: write

jobs:
  split:
    name: Split home style domains
    runs-on: ubuntu-latest

    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v5
        with:
          ref: refactor/split-main-screen
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Split home style domains
        run: node scripts/split-home-styles.cjs

      - name: Validate diff
        run: git diff --check

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle iOS app
        run: npx expo export --platform ios --output-dir /tmp/detour-style-split-export

      - name: Commit validated split
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "detour-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/styles
          git rm scripts/split-home-styles.cjs .github/workflows/split-home-styles.yml
          git commit -m "refactor: split home styles by domain"
          git push origin HEAD:refactor/split-main-screen
