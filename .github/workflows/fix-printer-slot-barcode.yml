name: Fix printer slot and barcode alignment

on:
  push:
    branches:
      - fix/printer-slot-barcode-alignment

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply alignment fix
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/styles/home/ticket-recap-styles.ts')
          text = path.read_text()

          old_viewport = """  v48PaperViewport: {\n    position: 'absolute',\n    top: 57,\n    width: 310,\n    height: 399,\n    overflow: 'hidden',\n    alignItems: 'center',\n    zIndex: 2,\n  },"""
          new_viewport = """  v48PaperViewport: {\n    position: 'absolute',\n    top: 54,\n    width: 310,\n    height: 402,\n    overflow: 'hidden',\n    alignItems: 'center',\n    zIndex: 2,\n  },"""
          if old_viewport not in text:
              raise SystemExit('v48PaperViewport block not found')
          text = text.replace(old_viewport, new_viewport, 1)

          old_mask = """  v48PrinterLipMask: {\n    position: 'absolute',\n    top: 0,\n    left: 0,\n    right: 0,\n    height: 78,\n    overflow: 'hidden',\n    zIndex: 4,\n  },"""
          new_mask = """  v48PrinterLipMask: {\n    position: 'absolute',\n    top: 0,\n    left: 0,\n    right: 0,\n    // Only mask through the slot lip. Below this point the paper must sit\n    // in front of the printer face so it visually exits the black slot.\n    height: 58,\n    overflow: 'hidden',\n    zIndex: 4,\n  },"""
          if old_mask not in text:
              raise SystemExit('v48PrinterLipMask block not found')
          text = text.replace(old_mask, new_mask, 1)

          old_barcode = """  v46ArtBarcode: {\n    position: 'absolute',\n    left: '21%',\n    right: '21%',\n    bottom: '6.8%',\n    height: 39,"""
          new_barcode = """  v46ArtBarcode: {\n    position: 'absolute',\n    left: '21%',\n    right: '21%',\n    bottom: '13%',\n    height: 39,"""
          if old_barcode not in text:
              raise SystemExit('v46ArtBarcode block not found')
          text = text.replace(old_barcode, new_barcode, 1)

          path.write_text(text)
          PY

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle iOS app
        run: npx expo export --platform ios --output-dir /tmp/detour-printer-alignment-export

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/home/ticket-recap-styles.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: align ticket with printer slot and barcode"
          git push origin HEAD:fix/printer-slot-barcode-alignment
