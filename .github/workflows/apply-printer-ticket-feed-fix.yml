name: Apply printer ticket feed fix

on:
  push:
    branches:
      - fix/printer-ticket-feed-physical

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply targeted printer patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/components/ticket-visuals.tsx",
              "export const DETOUR_TICKET_WIDTH = 310;",
              "export const DETOUR_TICKET_WIDTH = 280;",
          )

          replace_once(
              "src/hooks/use-detour-home-controller.ts",
              """      // The printer has already shown a small paper edge while searching.\n      // Once routing is real, finish the physical feed quickly instead of\n      // adding another full second of perceived loading.""",
              """      // The printer has already shown the leading ticket-stub edge while searching.\n      // Once routing is real, let the sheet feed at a readable mechanical pace\n      // so the stub, destination, trip details, and DETOUR header emerge in order.""",
          )

          replace_once(
              "src/hooks/use-detour-home-controller.ts",
              """        Animated.timing(routeProgress, {\n          toValue: 1,\n          duration: 650,\n          easing: Easing.out(Easing.cubic),\n          useNativeDriver: false,\n        }).start(() => resolve());""",
              """        Animated.timing(routeProgress, {\n          toValue: 1,\n          duration: 1900,\n          easing: Easing.inOut(Easing.quad),\n          useNativeDriver: false,\n        }).start(() => resolve());""",
          )

          replace_once(
              "src/styles/home/printer-overrides.ts",
              """    zIndex: 2,\n    shadowColor: '#000',\n    shadowOpacity: 0.14,\n    shadowRadius: 2,\n    shadowOffset: { width: 0, height: 1 },\n    elevation: 2,""",
              """    zIndex: 4,\n    shadowColor: '#000',\n    shadowOpacity: 0.14,\n    shadowRadius: 2,\n    shadowOffset: { width: 0, height: 1 },\n    elevation: 4,""",
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Remove temporary workflow and commit fix
        shell: bash
        run: |
          rm .github/workflows/apply-printer-ticket-feed-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make ticket feed physically coherent"
          git push origin HEAD:${GITHUB_REF_NAME}
