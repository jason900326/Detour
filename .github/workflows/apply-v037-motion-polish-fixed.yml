name: Apply DETOUR v0.37 motion polish fixed

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-v037-motion-polish-fixed.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Apply motion polish
        run: python .github/scripts/apply-v037-motion-polish.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax-check changed TypeScript
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');
          let failed = false;
          for (const file of ['src/app/index.tsx', 'src/lib/playtest-analytics.ts']) {
            const source = fs.readFileSync(file, 'utf8');
            const result = ts.transpileModule(source, {
              fileName: file,
              reportDiagnostics: true,
              compilerOptions: {
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.ESNext,
                jsx: ts.JsxEmit.ReactJSX,
              },
            });
            const errors = (result.diagnostics || []).filter(
              (d) => d.category === ts.DiagnosticCategory.Error
            );
            for (const error of errors) {
              console.error(file + ': ' + ts.flattenDiagnosticMessageText(error.messageText, '\n'));
            }
            if (errors.length) failed = true;
          }
          if (failed) process.exit(1);
          NODE

      - name: Remove migration files
        run: |
          rm .github/workflows/apply-v037-motion-polish.yml
          rm .github/workflows/apply-v037-motion-polish-fixed.yml
          rm .github/scripts/apply-v037-motion-polish.py

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: polish home route and motion"
          git push origin main
