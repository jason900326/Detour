name: Apply final ticket Skia integration

on:
  push:
    branches:
      - fix/final-ticket-skia-integration

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Bring in proven ticket-base Skia tear files
        shell: bash
        run: |
          git fetch origin prototype/freeform-ticket-tear
          git checkout origin/prototype/freeform-ticket-tear -- package.json src/app/_layout.tsx src/app/index.tsx src/components/ticket-tear-context.tsx src/components/ticket-visuals.tsx src/styles/home/ticket-recap-styles.ts

      - name: Adapt responsive printer to the one-piece ticket
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 match, found {count}")
              p.write_text(text.replace(old, new, 1))

          view = 'src/components/detour-home-view.tsx'
          replace_once(view, "  V45Ticket,\n  getDetourTicketGeometry,\n} from '../components/ticket-visuals';", "  V45Ticket,\n  DETOUR_TICKET_HEIGHT,\n  DETOUR_TICKET_WIDTH,\n} from '../components/ticket-visuals';")
          replace_once(view, "const ticketSlotFillRatio = 0.72;", "const ticketSlotFillRatio = 0.84;")
          replace_once(view, "const departButtonReserve = 68 + bottomPadding + 20;", "const tearHintReserve = 52 + bottomPadding;")
          replace_once(view, "- departButtonReserve);", "- tearHintReserve);")
          replace_once(view, "const unitGeometry = getDetourTicketGeometry(1);", "const ticketAspect = DETOUR_TICKET_HEIGHT / DETOUR_TICKET_WIDTH;")
          replace_once(view, "const ticketWidthFromHeight = maxPaperHeight / unitGeometry.physicalHeight;", "const ticketWidthFromHeight = maxPaperHeight / ticketAspect;")
          replace_once(view, "const ticketGeometry = getDetourTicketGeometry(ticketWidth);", "const ticketScale = ticketWidth / DETOUR_TICKET_WIDTH;\n    const ticketHeight = DETOUR_TICKET_HEIGHT * ticketScale;")
          replace_once(view, "      ticketGeometry,\n      paperViewportHeight: ticketGeometry.physicalHeight + 2,\n      assemblyHeight: 47 + ticketGeometry.physicalHeight + 2,", "      ticketHeight,\n      ticketScale,\n      paperViewportHeight: ticketHeight + 2,\n      assemblyHeight: 47 + ticketHeight + 2,")
          replace_once(view, "outputRange: [-printingLayout.ticketGeometry.physicalHeight, 0],", "outputRange: [-printingLayout.ticketHeight, 0],")

          ticket = 'src/components/ticket-visuals.tsx'
          replace_once(ticket, "  showStubArtwork?: boolean;\n};", "  showStubArtwork?: boolean;\n  renderWidth?: number;\n};")
          replace_once(ticket, "  artworkVisible = true,\n  showBarcode = false,\n}: V45TicketProps) {", "  artworkVisible = true,\n  showBarcode = false,\n  renderWidth = DETOUR_TICKET_WIDTH,\n}: V45TicketProps) {")
          replace_once(ticket, "  const stampOpacity = stampProgress ?? (stamped ? 1 : 0);\n\n  const feedStyle = {", "  const stampOpacity = stampProgress ?? (stamped ? 1 : 0);\n  const safeRenderWidth = Math.max(1, renderWidth);\n  const renderScale = safeRenderWidth / DETOUR_TICKET_WIDTH;\n  const renderedHeight = DETOUR_TICKET_HEIGHT * renderScale;\n\n  const feedStyle = {")
          old_root = "  return (\n    <Animated.View\n      style={[\n        styles.v46ArtTicket,\n        { width: DETOUR_TICKET_WIDTH, height: DETOUR_TICKET_HEIGHT },\n        artworkVisible && !artworkReady && styles.v49TicketArtworkPending,\n        feedStyle,\n      ]}\n    >"
          new_root = "  return (\n    <Animated.View\n      style={[\n        { width: safeRenderWidth, height: renderedHeight, overflow: 'visible', alignItems: 'center', justifyContent: 'center' },\n        artworkVisible && !artworkReady && !ticketImage && styles.v49TicketArtworkPending,\n        feedStyle,\n      ]}\n    >\n      <View\n        style={[\n          styles.v46ArtTicket,\n          { width: DETOUR_TICKET_WIDTH, height: DETOUR_TICKET_HEIGHT, transform: [{ scale: renderScale }] },\n        ]}\n      >"
          replace_once(ticket, old_root, new_root)
          replace_once(ticket, "{artworkVisible && (!hasTear || !ticketImage) && (", "{artworkVisible && !skiaArtworkReady && (")
          replace_once(ticket, "<Canvas style={[StyleSheet.absoluteFill, { opacity: hasTear ? 1 : 0 }] }>", "<Canvas style={StyleSheet.absoluteFill}>") if False else None
          replace_once(ticket, "<Canvas style={[StyleSheet.absoluteFill, { opacity: hasTear ? 1 : 0 }]}>", "<Canvas style={StyleSheet.absoluteFill}>")
          old_end = "      {tearEnabled && !finishing && (\n        <GestureDetector gesture={tearGesture}>\n          <View\n            accessible\n            accessibilityLabel=\"沿齒孔撕過中線，開始旅程\"\n            style={[\n              ticketOverlayStyles.gestureStrip,\n              {\n                top: gestureTop,\n                width: DETOUR_TICKET_WIDTH,\n                height: TEAR_HIT_HEIGHT,\n              },\n            ]}\n          />\n        </GestureDetector>\n      )}\n    </Animated.View>"
          new_end = "      {tearEnabled && !finishing && (\n        <GestureDetector gesture={tearGesture}>\n          <View\n            accessible\n            accessibilityLabel=\"沿齒孔撕過中線，開始旅程\"\n            style={[\n              ticketOverlayStyles.gestureStrip,\n              {\n                top: gestureTop,\n                width: DETOUR_TICKET_WIDTH,\n                height: TEAR_HIT_HEIGHT,\n              },\n            ]}\n          />\n        </GestureDetector>\n      )}\n      </View>\n    </Animated.View>"
          replace_once(ticket, old_end, new_end)

          replace_once(view, "                    renderWidth={printingLayout.ticketWidth}\n", "                    renderWidth={printingLayout.ticketWidth}\n")
          PY

      - name: Install Skia and regenerate lockfile
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle iOS
        run: npx expo export --platform ios --output-dir /tmp/detour-final-ticket-export

      - name: Commit verified integration
        shell: bash
        run: |
          rm .github/workflows/apply-final-ticket-skia-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: integrate responsive ticket-base with Skia tear"
          git push origin HEAD:${GITHUB_REF_NAME}
