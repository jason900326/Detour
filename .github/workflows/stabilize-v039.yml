name: Stabilize DETOUR v0.39

on:
  push:
    branches: [main]
    paths:
      - 'scripts/stabilize_v039.py'
      - '.github/workflows/stabilize-v039.yml'

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply stabilization
        run: python3 scripts/stabilize_v039.py

      - name: Syntax-check changed TypeScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');
          for (const file of ['src/app/index.tsx', 'src/lib/build-info.ts']) {
            const source = fs.readFileSync(file, 'utf8');
            const result = ts.transpileModule(source, {
              compilerOptions: {
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.ESNext,
                jsx: ts.JsxEmit.ReactJSX,
              },
              fileName: file,
              reportDiagnostics: true,
            });
            const errors = (result.diagnostics || []).filter(d => d.category === ts.DiagnosticCategory.Error);
            if (errors.length) {
              console.error(file);
              for (const d of errors) console.error(ts.flattenDiagnosticMessageText(d.messageText, '\n'));
              process.exit(1);
            }
          }
          NODE

      - name: Verify invariants
        run: |
          grep -F "DETOUR_BUILD_VERSION = '0.39.1'" src/lib/build-info.ts
          grep -F "const durationCandidates = await findSceneCandidates" src/app/index.tsx
          if grep -Fq "stage === 'color'" src/app/index.tsx; then exit 1; fi
          if grep -Fq "async function randomColor" src/app/index.tsx; then exit 1; fi
          if grep -Fq "async function chooseColor" src/app/index.tsx; then exit 1; fi
          git diff --check

      - name: Remove one-time migration files
        run: |
          rm -f scripts/stabilize_v039.py
          rm -f .github/workflows/stabilize-v039.yml

      - name: Commit stabilization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "fix: stabilize DETOUR v0.39"
          git push origin HEAD:main
