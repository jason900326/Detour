name: Apply DETOUR v0.40 field-ready convergence

on:
  push:
    branches:
      - chatgpt/v040-field-ready
    paths:
      - 'scripts/v040_field_ready.py'
      - 'scripts/v040_followup.py'
      - '.github/workflows/v040-field-ready.yml'

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply v0.40 migration
        run: |
          python3 scripts/v040_field_ready.py
          python3 scripts/v040_followup.py

      - name: Syntax-check changed TypeScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');
          for (const file of ['src/app/index.tsx', 'src/app/camera.tsx', 'src/lib/journey-engine.ts', 'src/lib/routing-engine.ts', 'src/lib/build-info.ts']) {
            const source = fs.readFileSync(file, 'utf8');
            const result = ts.transpileModule(source, {
              compilerOptions: {
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.ESNext,
                jsx: ts.JsxEmit.ReactJSX,
              },
              fileName: file,
              reportDiagnostics: true,
            });
            const errors = (result.diagnostics || []).filter(d => d.category === ts.DiagnosticCategory.Error);
            if (errors.length) {
              console.error(file);
              for (const d of errors) console.error(ts.flattenDiagnosticMessageText(d.messageText, '\n'));
              process.exit(1);
            }
          }
          NODE

      - name: Verify field-ready invariants
        run: |
          grep -F "DETOUR_BUILD_VERSION = '0.40.0'" src/lib/build-info.ts
          grep -F "const atCapacity = savedCount >= rollCapacity" src/app/camera.tsx
          grep -F "reservedMissionPhotoCount" src/app/index.tsx
          grep -F "const nextPassport = [entry, ...passport];" src/app/index.tsx
          grep -F "avoidRoutes?: GeoPoint[][]" src/lib/routing-engine.ts
          grep -F "estimatedJourneySeconds" src/lib/routing-engine.ts
          grep -F "小地圖" src/app/index.tsx
          if grep -Fq "visible={stage === 'camera'" src/app/index.tsx; then exit 1; fi
          if grep -Fq "activeCameraMission" src/app/index.tsx; then exit 1; fi
          if grep -Fq "點一下放大" src/app/index.tsx; then exit 1; fi
          git diff --check

      - name: Remove one-time migration files
        run: |
          rm -f scripts/v040_field_ready.py
          rm -f scripts/v040_followup.py
          rm -f .github/workflows/v040-field-ready.yml

      - name: Commit convergence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: converge DETOUR v0.40 field-ready flow"
          git push origin HEAD:chatgpt/v040-field-ready
