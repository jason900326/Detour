name: Apply DETOUR v0.39 test flow

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate_v039.py'
      - '.github/workflows/apply-v039.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply v0.39 migration
        run: python3 scripts/migrate_v039.py

      - name: Syntax-check changed TypeScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');
          const files = [
            'src/app/index.tsx',
            'src/lib/journey-engine.ts',
            'src/lib/routing-engine.ts',
            'src/lib/scene-engine.ts',
            'src/lib/playtest-analytics.ts',
            'src/lib/build-info.ts',
          ];
          let failed = false;
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            const result = ts.transpileModule(source, {
              compilerOptions: {
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.ESNext,
                jsx: ts.JsxEmit.ReactJSX,
              },
              fileName: file,
              reportDiagnostics: true,
            });
            const errors = (result.diagnostics || []).filter(d => d.category === ts.DiagnosticCategory.Error);
            if (errors.length) {
              failed = true;
              console.error(`\n${file}`);
              for (const d of errors) console.error(ts.flattenDiagnosticMessageText(d.messageText, '\n'));
            }
          }
          if (failed) process.exit(1);
          NODE

      - name: Verify migration results
        run: |
          grep -F "const TIME_STEPS = [15, 30, 45, 60, 90] as const;" src/app/index.tsx
          grep -F "{ id: 'color', label: '色色的', code: 'COLOR' }" src/app/index.tsx
          grep -F "Math.random() < 0.8" src/app/index.tsx
          grep -F "args.moodId === 'color'" src/lib/journey-engine.ts
          grep -F "DETOUR_BUILD_VERSION = '0.39.0'" src/lib/build-info.ts
          grep -F "'0.39.0';" src/lib/playtest-analytics.ts
          if grep -Fq "code: 'RED HIT'" src/lib/journey-engine.ts; then exit 1; fi
          if grep -Fq "code: 'BLUE HIT'" src/lib/journey-engine.ts; then exit 1; fi
          if grep -Fq "code: 'WHITE HIT'" src/lib/journey-engine.ts; then exit 1; fi
          git diff --check

      - name: Remove one-time migration files
        run: |
          rm -f scripts/migrate_v039.py
          rm -f .github/workflows/apply-v039.yml

      - name: Commit v0.39
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "feat: ship DETOUR v0.39 test flow"
          git push origin HEAD:main
