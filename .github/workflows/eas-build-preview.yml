name: Build DETOUR iOS preview

on:
  workflow_dispatch:

jobs:
  build:
    name: EAS Build → iOS preview
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check Expo token
        id: expo_token
        shell: bash
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN is not configured."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Start iOS preview build
        run: eas build --platform ios --profile preview --non-interactive --no-wait
