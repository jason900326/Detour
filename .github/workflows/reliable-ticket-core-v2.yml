name: Reliable ticket core v2

on:
  push:
    branches:
      - fix/reliable-ticket-core-v2
    paths:
      - ".github/workflows/reliable-ticket-core-v2.yml"
      - "scripts/fix_reliable_ticket_core_v2.py"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply reliable core patch
        run: python scripts/fix_reliable_ticket_core_v2.py

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle iOS app
        run: npx expo export --platform ios --output-dir /tmp/detour-reliable-core-v2

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/detour-home-view.tsx src/components/ticket-visuals.tsx src/styles/home/ticket-recap-styles.ts src/lib/scene-engine.ts src/lib/routing-engine.ts src/hooks/use-detour-home-controller.ts
          git commit -m "fix: simplify destination core and restore ticket art"
          git push origin HEAD:fix/reliable-ticket-core-v2
