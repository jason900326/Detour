name: Apply DETOUR v0.41 UX flow

on:
  push:
    branches:
      - chatgpt/v041-ux-flow
    paths:
      - 'scripts/v041_ux_flow.py'
      - 'scripts/v041_patch_migration.py'
      - '.github/workflows/v041-ux-flow.yml'

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch migration
        run: python3 scripts/v041_patch_migration.py

      - name: Apply v0.41 migration
        run: python3 scripts/v041_ux_flow.py

      - name: Syntax-check changed TypeScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');
          for (const file of ['src/app/index.tsx', 'src/app/camera.tsx', 'src/lib/routing-engine.ts', 'src/lib/build-info.ts']) {
            const source = fs.readFileSync(file, 'utf8');
            const result = ts.transpileModule(source, {
              compilerOptions: {
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.ESNext,
                jsx: ts.JsxEmit.ReactJSX,
              },
              fileName: file,
              reportDiagnostics: true,
            });
            const errors = (result.diagnostics || []).filter(d => d.category === ts.DiagnosticCategory.Error);
            if (errors.length) {
              console.error(file);
              for (const d of errors) console.error(ts.flattenDiagnosticMessageText(d.messageText, '\n'));
              process.exit(1);
            }
          }
          NODE

      - name: Verify v0.41 invariants
        run: |
          grep -F "DETOUR_BUILD_VERSION = '0.41.0'" src/lib/build-info.ts
          grep -F "pendingCaptureUri" src/app/camera.tsx
          grep -F "留下這張" src/app/camera.tsx
          grep -F ".slice(0, 3)" src/lib/routing-engine.ts
          grep -F "TICKET_ROUTING_BUDGET_MS = 6800" src/lib/routing-engine.ts
          grep -F "收起地圖" src/app/index.tsx
          grep -F "室內測試 · 下一段" src/app/index.tsx
          grep -F "v41PassportCard" src/app/index.tsx
          grep -F "ticketBuildError" src/app/index.tsx
          if grep -Fq "transitionTo('mood');" <(python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('src/app/index.tsx').read_text()
          m=re.search(r"async function prepareDetourTicket\(\).*?async function startDetour", t, re.S)
          print(m.group(0) if m else '')
          PY
          ); then exit 1; fi
          git diff --check

      - name: Remove one-time migration files
        run: |
          rm -f scripts/v041_ux_flow.py
          rm -f scripts/v041_patch_migration.py
          rm -f .github/workflows/v041-ux-flow.yml

      - name: Commit convergence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: polish DETOUR v0.41 field UX"
          git push origin HEAD:chatgpt/v041-ux-flow
