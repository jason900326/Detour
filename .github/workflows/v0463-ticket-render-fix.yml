name: Apply v0.46.3 ticket render fix

on:
  push:
    branches:
      - chatgpt/v0462-navigation-polish
    paths:
      - scripts/v0463_fix_ticket_render.py
      - .github/workflows/v0463-ticket-render-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/v0462-navigation-polish
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply v0.46.3 migration
        run: python3 scripts/v0463_fix_ticket_render.py

      - name: Verify ticket invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('src/app/index.tsx').read_text(encoding='utf-8')
          required = [
            'height: 110,',
            'v49TicketArtworkPending',
            'onLoad={markArtworkReady}',
            'ticketArtworkDecoded = true',
            'top: 57,',
          ]
          for item in required:
              assert item in text, item
          assert "aspectRatio: 2048 / 682" not in text[text.index('v48PrinterBase:'):text.index('v48PaperViewport:')]
          PY

      - name: Syntax-check TypeScript
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');
          for (const file of ['src/app/index.tsx','src/lib/build-info.ts']) {
            const src = fs.readFileSync(file, 'utf8');
            const out = ts.transpileModule(src, {
              compilerOptions: { jsx: ts.JsxEmit.ReactJSX, target: ts.ScriptTarget.ES2020, module: ts.ModuleKind.ESNext },
              reportDiagnostics: true,
              fileName: file,
            });
            const errors = (out.diagnostics || []).filter(d => d.category === ts.DiagnosticCategory.Error);
            if (errors.length) {
              console.error(errors.map(d => ts.flattenDiagnosticMessageText(d.messageText, '\n')).join('\n'));
              process.exit(1);
            }
          }
          NODE

      - name: Bundle-check Expo iOS
        run: npx expo export --platform ios --output-dir /tmp/detour-v0463-export

      - name: Clean one-time files
        run: rm -f scripts/v0463_fix_ticket_render.py .github/workflows/v0463-ticket-render-fix.yml

      - name: Check diff
        run: git diff --check

      - name: Commit finished fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: pin printer and unify ticket reveal'
          git push origin HEAD:chatgpt/v0462-navigation-polish
