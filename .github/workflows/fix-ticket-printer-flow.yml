name: Fix ticket printer physical flow

on:
  push:
    branches:
      - fix/ticket-printer-physical-flow

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply printer flow fix
        run: python3 scripts/fix_ticket_printer_flow.py

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle iOS app
        run: npx expo export --platform ios --output-dir /tmp/detour-ticket-printer-export

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/use-detour-home-controller.ts src/components/detour-home-view.tsx src/styles/home/ticket-recap-styles.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: make ticket printing physically coherent"
          git push origin HEAD:fix/ticket-printer-physical-flow
