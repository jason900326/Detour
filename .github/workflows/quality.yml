name: Detour code quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "backend/**"
      - "scripts/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck and bundle iOS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Inspect ticket artwork dimensions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct

          for name in ('ticket-back.png', 'ticket-main.png', 'ticket-stub.png'):
              path = Path('assets/detour') / name
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{name}: not PNG')
              width, height = struct.unpack('>II', data[16:24])
              print(f'TICKET_ASSET {name}: {width}x{height} bytes={len(data)}')
          PY

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Check Scene importer syntax
        run: python3 -m py_compile scripts/import_osm_scenes.py

      - name: Bundle iOS app
        run: npx expo export --platform ios --output-dir /tmp/detour-quality-export
