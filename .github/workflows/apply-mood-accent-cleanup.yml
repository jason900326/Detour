name: Apply mood accent cleanup

on:
  push:
    branches: [main]
    paths:
      - 'scripts/remove-mood-accent.mjs'
      - '.github/workflows/apply-mood-accent-cleanup.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remove mood accent strokes
        run: node scripts/remove-mood-accent.mjs

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/remove-mood-accent.mjs .github/workflows/apply-mood-accent-cleanup.yml
          git add src/app/index.tsx
          git commit -m "fix: remove mood card accent strokes"
          git push
