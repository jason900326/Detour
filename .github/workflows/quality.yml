name: Detour code quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "backend/**"
      - "scripts/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck and bundle iOS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # Prototype branch added Skia before its lockfile is regenerated on the
      # developer machine. Use npm install here so CI can validate the graphics
      # experiment; restore npm ci before this work is merged to main.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Check Scene importer syntax
        run: python3 -m py_compile scripts/import_osm_scenes.py

      - name: Bundle iOS app
        run: npx expo export --platform ios --output-dir /tmp/detour-quality-export
