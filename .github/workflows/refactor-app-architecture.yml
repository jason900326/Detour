name: Validate app architecture refactor

on:
  push:
    branches:
      - refactor/app-architecture-v1
    paths:
      - "scripts/refactor-app-model.py"
      - ".github/workflows/refactor-app-architecture.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    name: Extract model and bundle iOS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v5
        with:
          ref: refactor/app-architecture-v1
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply model extraction
        run: python scripts/refactor-app-model.py

      - name: Validate diff
        run: git diff --check

      - name: Bundle iOS app
        run: npx expo export --platform ios --output-dir /tmp/detour-refactor-export

      - name: Commit validated refactor
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No refactor changes to commit."
            exit 0
          fi
          git config user.name "detour-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/index.tsx src/lib/app-model.ts
          git rm scripts/refactor-app-model.py .github/workflows/refactor-app-architecture.yml
          git commit -m "refactor: extract app model from main screen"
          git push origin HEAD:refactor/app-architecture-v1
