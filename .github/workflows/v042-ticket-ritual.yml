name: Apply DETOUR v0.42 ticket ritual

on:
  push:
    branches:
      - chatgpt/v042-ticket-ritual
    paths:
      - 'scripts/v042_ticket_ritual.py'
      - '.github/workflows/v042-ticket-ritual.yml'

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply v0.42 migration
        run: python3 scripts/v042_ticket_ritual.py

      - name: Syntax-check changed TypeScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');
          for (const file of ['src/app/index.tsx', 'src/lib/build-info.ts']) {
            const source = fs.readFileSync(file, 'utf8');
            const result = ts.transpileModule(source, {
              compilerOptions: {
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.ESNext,
                jsx: ts.JsxEmit.ReactJSX,
              },
              fileName: file,
              reportDiagnostics: true,
            });
            const errors = (result.diagnostics || []).filter(d => d.category === ts.DiagnosticCategory.Error);
            if (errors.length) {
              console.error(file);
              for (const d of errors) console.error(ts.flattenDiagnosticMessageText(d.messageText, '\n'));
              process.exit(1);
            }
          }
          NODE

      - name: Verify ticket invariants
        run: |
          grep -F "DETOUR_BUILD_VERSION = '0.42.0'" src/lib/build-info.ts
          grep -F "function DetourTicket(" src/app/index.tsx
          test "$(grep -c '<DetourTicket' src/app/index.tsx)" -eq 2
          grep -F "終點保密" src/app/index.tsx
          grep -F "ticketReadyUnlocked" src/app/index.tsx
          grep -F "outputRange: [-392, 0]" src/app/index.tsx
          python3 - <<'PY'
          from pathlib import Path
          t = Path('src/app/index.tsx').read_text()
          start = t.index("{stage === 'preparing' && (")
          end = t.index("{stage === 'journey' &&", start)
          flow = t[start:end]
          for forbidden in ['v41PreparingStatus', 'ticketReadyMeta', 'ticketReadyTitle', '車票好了']:
              assert forbidden not in flow, forbidden
          PY
          git diff --check

      - name: Remove one-time migration files
        run: |
          rm -f scripts/v042_ticket_ritual.py
          rm -f .github/workflows/v042-ticket-ritual.yml

      - name: Commit convergence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make DETOUR ticket one continuous ritual"
          git push origin HEAD:chatgpt/v042-ticket-ritual
